# Render Blueprint for the N1 match server.
# Creating the Render account and the service is a one-time step in the Render dashboard.
# This file does not pick a public hostname. Copy the host Render assigns, then set
# GitHub Actions variable VITE_WS_URL to wss://<that-host> and rebuild GitHub Pages.
# See docs/networking-n1.md.
services:
  - type: web
    name: pacman-101-match
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
