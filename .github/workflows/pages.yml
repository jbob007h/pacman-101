name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/pacman-101-milestone-1-cf5f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Vite inlines VITE_WS_URL at build time. An empty repo variable leaves
      # the Pages client with no socket, so Online does not fall back to localhost.
      - name: Build
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
